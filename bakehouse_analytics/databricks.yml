# This is a Declarative Automation Bundle definition for bakehouse_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse_analytics
  uuid: 48fbad5f-83c2-4a2b-adf4-ef6b12da23ce

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-b83615e0-c0fa.cloud.databricks.com
    variables:
      catalog: bakehouse_dev_catalog
      schema: rnd
  prod:
    mode: production
    workspace:
      host:  https://dbc-b83615e0-c0fa.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/dipendu007@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/hello.dipendu.mishra2@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_prod_catalog
      schema: rnd
    permissions:
      - user_name: hello.dipendu.mishra2@gmail.com
        level: CAN_MANAGE